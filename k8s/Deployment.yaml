apiVersion: apps/v1
kind: Deployment
metadata:
  name: friday-chatbot
  labels:
    app: friday-chatbot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: friday-chatbot
  template:
    metadata:
      labels:
        app: friday-chatbot
    spec:
      containers:
        - name: friday-chatbot
          image: adhil6407/friday-chatbot:3
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"