apiVersion: apps/v1
kind: Deployment
metadata:
  name: friday
  labels:
    app: friday
spec:
  replicas: 2
  selector:
    matchLabels:
      app: friday
  template:
    metadata:
      labels:
        app: friday
    spec:
      containers:
        - name: friday
          image: adhil6407/friday:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"